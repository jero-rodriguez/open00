name: CI
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node -e "const m=require('./dist/system.json');if(m.compatibility.minimum!=='14.367'||m.compatibility.verified!=='14.367')process.exit(1)"
      - run: node -e "const m=process.env.TITLE;if(!/^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([\\w.-]+\\))?!?: .+$/.test(m))process.exit(1)" 
        env: { TITLE: ${{ github.event.pull_request.title }} }
