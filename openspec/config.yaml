schema: spec-driven

context: |
  Project: open00 (Foundry VTT system repository; current HEAD contains no application source after a deletion commit).
  Stack: Not detectable from the current checkout; no package, build, or source manifests are present.
  Architecture: Not detectable; implementation architecture must be established by the first change.
  Testing: No test runner or quality-tool configuration is present in the current checkout.
  Style: No project conventions are present; SDD technical artifacts use English and Conventional Commits remain required.

strict_tdd: true

testing:
  detected: 2026-08-27
  strict_tdd: true
  test_runner:
    command: ""
    framework: unavailable
  test_layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality_tools:
    linter:
      available: false
      command: ""
    type_checker:
      available: false
      command: ""
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Define the smallest incremental, micro-testable slice and its compatibility boundary.
    - Include rollback and migration considerations for risky changes.
  specs:
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Use Given/When/Then scenarios and keep requirements independently testable.
  design:
    - Document architecture decisions with rationale and identify Foundry VTT integration boundaries.
    - Include sequence diagrams for complex flows.
  tasks:
    - Group work by phase with hierarchical numbering; keep each task completable in one session.
    - Include RED, GREEN, and REFACTOR evidence because Strict TDD is enabled.
  apply:
    guidelines:
      - Establish a test harness before product implementation when no runner exists.
      - Follow existing code patterns once the project is rebuilt.
    tdd: true
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
